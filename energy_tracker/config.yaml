# Home Assistant add-on definition. Home Assistant reads this to know how to run the app.
name: Energy Tracker
version: "0.42.0"
slug: energy_tracker
url: https://github.com/Suchabadpanda/ha-energy-tracker
description: For Sigenergy solar and battery systems. Live energy use and running costs on your tariff
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Opens inside Home Assistant (sidebar), behind Home Assistant's own login. No network
# port is published, so nothing else on the network can reach it directly.
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: Energy Tracker
# Shown to every Home Assistant user; who may change anything is set by edit_access below.
panel_admin: false
# Lets the app read sensor values and history from Home Assistant. No token to manage.
homeassistant_api: true
# The add-on's own config folder, for an optional metrics.toml that replaces the built-in one.
map:
  - addon_config:rw
# Stop briefly while a backup is taken, so the database is copied in a consistent state.
backup: cold
options:
  poll_seconds: 30
  backfill_days: 10
  detail_days: 30
  keep_years: 10
  smart_load_label: Heat pump
  ev_on_smart_load: true
  axle_event_entity: sensor.axle_event
  outdoor_temperature_entity: ""
  heat_pump_energy_entity: ""
  hot_water_tank_entity: ""
  hot_water_mode_entity: ""
  heating_mode_entity: ""
  flow_temperature_entity: ""
  currency_symbol: "£"
  currency_minor: p
  edit_access: admins
  edit_users: []
schema:
  poll_seconds: int(10,3600)
  backfill_days: int(0,30)
  detail_days: int(7,3650)
  keep_years: int(1,50)
  smart_load_label: str
  ev_on_smart_load: bool
  axle_event_entity: str
  outdoor_temperature_entity: str?
  heat_pump_energy_entity: str?
  hot_water_tank_entity: str?
  hot_water_mode_entity: str?
  heating_mode_entity: str?
  flow_temperature_entity: str?
  currency_symbol: str
  currency_minor: str
  edit_access: list(everyone|admins|owner)
  edit_users:
    - str
